name: cloud-storage

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: cloud
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: cloud
      DB_PASSWORD: cloud
      STORAGE_PATH: /data/storage
    ports:
      - "8080:8080"
    depends_on:
      - db
    volumes:
      - ./storage:/data/storage

volumes:
  db-data: